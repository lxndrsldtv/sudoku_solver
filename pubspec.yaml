name: sudoku_solver
description: Sudoku solver Flutter application.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=2.19.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  # cupertino_icons: ^1.0.2
  collection: ^1.19.1
  provider: ^6.1.2
  camera: ^0.11.1
  image: ^4.5.3
  google_mlkit_text_recognition: ^0.14.0
  path_provider: ^2.1.5
  image_picker: ^1.1.2
  logging: ^1.3.0
  flutter_bloc: ^9.1.0
  flutter_localizations:
    sdk: flutter
  intl: any
  cross_file: ^0.3.4
  file_picker: ^9.0.2
  talker_flutter: ^4.7.0
  flutter_simple_dependency_injection: ^2.0.0

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  bloc_test: ^10.0.0
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  # generate: true
  assets:
    - assets/images/sudoku.png
